version: '3.8'
services:
  db:
    image: postgres:15
    container_name: hr_onboarding_db
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: hr_onboarding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_onboarding"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr_onboarding_backend
    environment:
      DATABASE_URL: postgresql://hr_user:hr_password@db:5432/hr_onboarding?schema=public
      JWT_SECRET: supersecretjwtkey
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr_onboarding_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/graphql
    ports:
      - "3001:3000"
    restart: always

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: hr_onboarding_ai
    ports:
      - "8000:8000"
    restart: always

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hr_onboarding_nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - ai_service
    restart: always

volumes:
  postgres_data: